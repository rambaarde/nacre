# Conventional commits on main accumulate into a Release PR that maintains
# CHANGELOG.md and the package version. Merging that PR cuts the tag and the
# GitHub Release, and publishes to npm in the SAME run — a GITHUB_TOKEN-created
# release event cannot trigger a separate workflow, so `on: release: published`
# would never fire.
#
# Both jobs live in this one file on purpose. npm's trusted publisher is pinned
# to the workflow filename, and for OIDC npm reads the TOP-LEVEL workflow of the
# run. Splitting the publish half into its own file — even called via
# `uses:` — would make npm see the caller instead and refuse the publish.
#
# There is deliberately no NPM_TOKEN. Trusted Publishing mints a short-lived
# OIDC token for this exact workflow in this exact repository, so nothing
# long-lived exists to leak or rotate — and npm is restricting the bypass-2FA
# tokens that were the only other way to publish unattended.
#
# One-time setup on npmjs.com, which cannot be done from here:
#   nacre-cli → Settings → Trusted Publisher → GitHub Actions
#   repository: rambaarde/nacre   workflow: publish.yml
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Opens and maintains the Release PR. Merging that PR is what sets
  # release_created, which is the only thing that reaches npm.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to mint the OIDC token npm verifies
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing needs npm >= 11.5.1; the bundled one may be older.
      - run: npm install -g npm@latest

      - run: npm ci

      # The same suite ci.yml runs, re-run on the release commit. Publishing
      # something that was never tested at this exact sha is how a green PR
      # ships a red package.
      - run: npm run typecheck
      - run: npm test

      # Assert the artifact, not package.json's claims about it. Repeated here
      # because this is the last moment before bytes reach a stranger.
      - name: assert the tarball before it leaves
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            // npm 12 changed this from an array to an object keyed by package
            // name. Accept both: the guard exists to check the bytes, not to
            // have an opinion about the envelope npm wraps them in.
            const raw = require("/tmp/pack.json");
            const meta = Array.isArray(raw) ? raw[0] : Object.values(raw)[0];
            if (!meta || !Array.isArray(meta.files)) {
              console.error("unrecognised npm pack --json shape: " + JSON.stringify(Object.keys(raw)));
              process.exit(1);
            }
            const files = meta.files.map((f) => f.path);
            const fail = (msg) => { console.error(msg); process.exitCode = 1; };
            for (const required of [
              "dist/bin/nacre.js",
              "skills/nacre-load/SKILL.md",
              "skills/nacre-publish/SKILL.md",
              "store-template/_company.md",
              "README.md",
            ]) if (!files.includes(required)) fail("missing from tarball: " + required);
            const junk = files.filter((f) => /(^|\/)test\/|\.map$|\.d\.ts$/.test(f));
            if (junk.length) fail("must not publish: " + junk.join(", "));
            console.log(`ok: ${meta.entryCount} files, ${(meta.size / 1024).toFixed(1)}kb`);
          '

      # Provenance requires a PUBLIC source repository — npm rejects the bundle
      # with 422 otherwise, AFTER signing it, so the failure arrives late and
      # reads like an auth problem when it is not. Trusted publishing itself
      # works either way; this switches itself on if the repo becomes public.
      - name: publish
        run: npm publish --access public ${{ github.event.repository.private && ' ' || '--provenance' }}

      - name: verify it is actually installable
        run: |
          VERSION='${{ needs.release-please.outputs.version }}'
          for i in 1 2 3 4 5 6; do
            npm view "nacre-cli@$VERSION" version >/dev/null 2>&1 && break
            echo "waiting for the registry to serve $VERSION ($i)"; sleep 10
          done
          WORK=$(mktemp -d)
          cd "$WORK"
          npm init -y >/dev/null
          npm install "nacre-cli@$VERSION" --prefer-online
          # --version shipped broken once while working perfectly in the repo,
          # because bin/ and dist/bin/ are different layouts. Run the installed
          # binary, which is the only place that bug could ever appear.
          GOT=$(./node_modules/.bin/nacre --version)
          [ "$GOT" = "$VERSION" ] || { echo "installed binary reports $GOT, expected $VERSION"; exit 1; }
          ./node_modules/.bin/nac --version >/dev/null
          echo "ok: nacre-cli@$VERSION installs and runs"
