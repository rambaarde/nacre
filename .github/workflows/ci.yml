# Tests that only run on someone's laptop are half a test suite: the suite
# shipped broken once already (`node --test test/` resolved the directory as a
# module and ran nothing), and nothing would have caught it.
#
# There is an install step now, for TypeScript and @types/node. Those are dev
# dependencies — the published package still ships zero runtime dependencies,
# and the second job below enforces exactly that rather than trusting the
# distinction to be remembered.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # A teammate on Windows is the case that fails for a path-separator reason and
  # teaches nothing about whether shared memory works. Nobody had ever run this
  # there.
  #
  # Its own job rather than an OS axis on `test`: adding one renames every check
  # ("test (20)" becomes "test (20, ubuntu-latest)"), and main's required checks
  # name the old ones — so every PR would wait forever on a check that no longer
  # exists.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # ubuntu-latest is one distro with one libc. These are the differences that
  # actually bite a zero-dependency Node tool: musl instead of glibc, and a base
  # image with no git until it is installed — varve shells out to git for every
  # read, so an image without it is a real user's first five minutes.
  #
  # Names stay off the `test` job for the same reason as `windows`: main's
  # required checks reference "test (20|22|24)" exactly.
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: node:22-alpine # musl
            setup: apk add --no-cache git
          - image: node:22-slim # debian, minimal
            setup: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          - image: fedora:latest # rpm, and Node from the distro rather than nodejs.org
            setup: dnf install -y nodejs npm git
    container: ${{ matrix.image }}
    steps:
      - name: prepare the image
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v4
      - name: git must trust a checkout it did not create
        # Containers run as a different user than the one that wrote the files,
        # so git refuses the directory as "dubious ownership" — and every git
        # call varve makes fails with an error about the repo, not about varve.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: node --version && npm --version && git --version
      - run: npm ci
      - run: npm test

  no-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assert zero RUNTIME dependencies
        # The install story is the product's answer to a competitor's heavy
        # setup. A dependency added quietly would take that answer away.
        run: |
          node -e '
            const pkg = require("./package.json");
            // devDependencies are fine — they never reach an installing user.
            // `dependencies` is what `npm i -g varve-cli` would have to download.
            const deps = Object.keys(pkg.dependencies ?? {});
            if (deps.length) {
              console.error("runtime dependencies present:", deps.join(", "));
              process.exit(1);
            }
            console.log("ok: zero runtime dependencies");
          '

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        # `npm pack` reports the files that exist on disk, so an unbuilt dist/
        # would make the assertion below fail for the wrong reason. This is the
        # same build `prepublishOnly` runs at publish time.
      - run: npm run build

      - name: assert the TARBALL is right, not just files[]
        # This used to check `files.includes("dist")` — a string standing in for
        # "the CLI ships". It passed while the tarball carried the compiled test
        # suite and source maps pointing at .ts files that were never published.
        # A proxy cannot catch that; only the artifact can. So ask npm what it
        # would actually upload, and assert on those bytes.
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            // npm 12 changed this from an array to an object keyed by
            // package name. Accept both: the guard exists to check the bytes,
            // not to have an opinion about the envelope npm wraps them in.
            const raw = require("/tmp/pack.json");
            const meta = Array.isArray(raw) ? raw[0] : Object.values(raw)[0];
            if (!meta || !Array.isArray(meta.files)) {
              console.error("unrecognised npm pack --json shape: " + JSON.stringify(Object.keys(raw)));
              process.exit(1);
            }
            const files = meta.files.map((f) => f.path);
            const fail = (msg) => { console.error(msg); process.exitCode = 1; };

            // Someone installing varve-cli gets nothing without this.
            for (const required of [
              "dist/bin/varve.js",
              "skills/varve-load/SKILL.md",
              "skills/varve-publish/SKILL.md",
              "store-template/_company.md",
              "README.md",
            ]) if (!files.includes(required)) fail("missing from tarball: " + required);

            // Tests, maps and declarations are weight a user never asked for;
            // the maps additionally reference sources that are not shipped.
            const junk = files.filter((f) => /(^|\/)test\/|\.map$|\.d\.ts$/.test(f));
            if (junk.length) fail("must not publish: " + junk.join(", "));

            console.log(`ok: ${meta.entryCount} files, ${(meta.size / 1024).toFixed(1)}kb packed`);
          '
