# Tests that only run on someone's laptop are half a test suite: the suite
# shipped broken once already (`node --test test/` resolved the directory as a
# module and ran nothing), and nothing would have caught it.
#
# There is an install step now, for TypeScript and @types/node. Those are dev
# dependencies — the published package still ships zero runtime dependencies,
# and the second job below enforces exactly that rather than trusting the
# distinction to be remembered.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  no-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assert zero RUNTIME dependencies
        # The install story is the product's answer to a competitor's heavy
        # setup. A dependency added quietly would take that answer away.
        run: |
          node -e '
            const pkg = require("./package.json");
            // devDependencies are fine — they never reach an installing user.
            // `dependencies` is what `npx varve` would have to download.
            const deps = Object.keys(pkg.dependencies ?? {});
            if (deps.length) {
              console.error("runtime dependencies present:", deps.join(", "));
              process.exit(1);
            }
            const files = pkg.files ?? [];
            if (!files.includes("dist")) {
              console.error("package.json files[] must ship dist/");
              process.exit(1);
            }
            console.log("ok: zero runtime dependencies, dist shipped");
          '
